name: Release

# Push a version tag (e.g. v1.3.0) to build and publish a GitHub Release:
#   git tag v1.3.0 && git push origin v1.3.0

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish (arm64)
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Build (Release)
        run: |
          set -o pipefail
          xcodebuild -project trackpad_control.xcodeproj \
            -scheme trackpad_control \
            -configuration Release \
            -derivedDataPath build-release \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Report compile errors as annotations
        if: failure()
        run: |
          grep -E "(error|warning):" "$GITHUB_WORKSPACE/build.log" \
            | grep -v "^$" | sort -u | head -50 \
            | while IFS= read -r line; do echo "::error::${line:0:400}"; done

      - name: Verify deployment target and architecture
        run: |
          APP="build-release/Build/Products/Release/Trackpad Control.app"
          BIN="$APP/Contents/MacOS/trackpad_control"
          echo "--- binary build metadata ---"
          vtool -show-build "$BIN"
          MINOS=$(vtool -show-build "$BIN" | awk '/minos/ {print $NF}')
          echo "binary minos = $MINOS"
          if [[ "$MINOS" != 26.* ]]; then
            echo "::error::Expected deployment target 26.x, got $MINOS"
            exit 1
          fi
          echo "--- architectures ---"
          lipo -archs "$BIN"

      - name: Package app
        run: |
          cd build-release/Build/Products/Release
          zip -r -q "$GITHUB_WORKSPACE/trackpad_control-${{ github.ref_name }}.zip" "Trackpad Control.app"
          shasum -a 256 "$GITHUB_WORKSPACE/trackpad_control-${{ github.ref_name }}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists — replacing asset"
            gh release upload "$TAG" "$GITHUB_WORKSPACE/trackpad_control-$TAG.zip" --clobber
          else
            gh release create "$TAG" \
              "$GITHUB_WORKSPACE/trackpad_control-$TAG.zip" \
              --title "Trackpad Control $TAG" \
              --notes "Requires macOS 26.4 or newer (Apple Silicon).

              **First launch:** right-click the app -> Open -> Open (app is unsigned)."
          fi
